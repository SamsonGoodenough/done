# Development config: proxies the SPA to the Vite dev server (for HMR) and
# the API to php-fpm. See nginx.prod.conf for the production variant that
# serves the built static assets instead.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum's SPA csrf-cookie route lives outside /api (registered by the
    # package itself at a fixed path), so it needs its own proxy rule.
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /avatars/ {
        alias /usr/share/nginx/avatars/;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
